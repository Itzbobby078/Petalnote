<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e6">
<title>petalnote ✿ a little surprise for you</title>
<meta name="description" content="Someone made a little surprise just for you. Tap to open.">
<meta property="og:title" content="A little surprise for you ♡">
<meta property="og:description" content="Someone made something beautiful just for you. Tap to open.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#7a3355;--soft:#a25a7c;--acc:#e0568c;--acc2:#ff8fb8;
  --card:rgba(255,255,255,.58);--cardb:rgba(255,255,255,.92);--glow:rgba(224,86,140,.3);
  --script:'Great Vibes','Brush Script MT',cursive;--hand:'Caveat','Segoe Script',cursive;--sans:'Quicksand',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);overflow:hidden;display:flex;justify-content:center;background:linear-gradient(135deg,#ffe3ee,#ffd0e2)}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100svh;overflow:hidden;background:#ffe9f1;box-shadow:0 0 70px rgba(224,86,140,.3)}
.hidden{display:none!important}
button{font-family:inherit;color:inherit}
.view{position:absolute;inset:0}

/* ---------------- BACKGROUNDS ---------------- */
#scene{position:absolute;inset:0;overflow:hidden}
.bgs{--u:1;position:absolute;inset:0;overflow:hidden}
.bgs .cl{position:absolute;border-radius:50%;filter:blur(calc(28px*var(--u)))}
.bgs .deco{position:absolute;inset:0;width:100%;height:100%}
.bgs .grain{position:absolute;inset:0;opacity:.45;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .4 0 0 0 0 .45 0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bgs.sky{background:linear-gradient(180deg,#a9c8d5 0%,#c3dae0 42%,#b3cad8 100%)}
.sky .c1{left:-20%;top:-6%;width:80%;height:26%;background:radial-gradient(closest-side,#f7c3c1,#f9d9d1 58%,transparent)}
.sky .c2{right:-28%;bottom:2%;width:90%;height:34%;background:radial-gradient(closest-side,#f8cfc9,#fbe5d6 55%,transparent)}
.sky .c3{right:-12%;top:7%;width:56%;height:13%;background:radial-gradient(closest-side,rgba(255,255,255,.65),transparent)}
.sky .c4{left:2%;top:46%;width:88%;height:15%;background:radial-gradient(closest-side,rgba(250,214,210,.55),transparent)}
.sky .c5{left:-10%;top:68%;width:60%;height:14%;background:radial-gradient(closest-side,rgba(255,255,255,.4),transparent)}
.bgs.bows{background:radial-gradient(ellipse at 50% 48%,#fbc9d3 0%,#fcdcdc 32%,#fdece8 68%,#fbe6e0 100%)}
.bgs.wash{background:linear-gradient(160deg,#fff0f5,#ffe6ee 55%,#ffe9f0)}
.wash .w1{right:-34%;top:-8%;width:92%;height:46%;background:radial-gradient(closest-side,rgba(246,166,192,.92),rgba(250,190,210,.5) 62%,transparent)}
.wash .w2{left:-38%;bottom:-8%;width:104%;height:44%;background:radial-gradient(closest-side,rgba(246,166,192,.92),rgba(250,190,210,.5) 62%,transparent)}
.wash .w3{left:-10%;top:30%;width:60%;height:18%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent)}
.bgs.custom{background:#ffdce8 center/cover no-repeat}
.bgs .veil{position:absolute;inset:0;background:rgba(255,255,255,.22)}
.drift{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.drift span{position:absolute;top:-30px;opacity:0;animation:drift linear infinite;text-shadow:0 0 8px rgba(255,255,255,.8)}
@keyframes drift{0%{transform:translate(0,-5vh) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate(40px,108vh) rotate(360deg);opacity:0}}

/* ---------------- GENERIC UI ---------------- */
.pill{border:1px solid var(--cardb);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.85rem;color:var(--acc);cursor:pointer;box-shadow:0 4px 14px var(--glow)}
.pill.ico{width:40px;height:40px;padding:0;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.pill.ico.on{animation:beat 1.2s infinite;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.btn{border:0;cursor:pointer;font-weight:700;font-size:1rem;color:#fff;padding:13px 24px;border-radius:999px;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 8px 22px var(--glow);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--card);color:var(--acc);border:1px solid var(--cardb);box-shadow:0 4px 14px var(--glow)}
.btn.small{padding:9px 16px;font-size:.85rem}
.btn[disabled]{opacity:.6;pointer-events:none}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;padding:70px 16px 88px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .55s,transform .55s,visibility .55s}
.screen.active{opacity:1;visibility:visible;transform:none}
.hdr{position:absolute;top:62px;left:0;right:0;pointer-events:none;z-index:2}
.hdr h2,h2.t{font-family:var(--script);font-weight:400;font-size:clamp(2.4rem,10vw,3.2rem);color:var(--acc);text-shadow:0 0 16px rgba(255,255,255,.9),0 2px 12px var(--glow);line-height:1.05}
.hdr p,.sub{font-size:.92rem;font-weight:600;color:var(--soft);text-shadow:0 0 10px rgba(255,255,255,.9)}
.small{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:700}
.nav{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:16px;z-index:30}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid var(--cardb);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:1.6rem;color:var(--acc);cursor:pointer;box-shadow:0 4px 14px var(--glow);line-height:1;padding-bottom:3px}
.dots{display:flex;gap:8px;padding:10px 14px;border-radius:999px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--cardb)}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(224,86,140,.28);transition:.3s}
.dots i.on{background:var(--acc);transform:scale(1.35)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-10px)}}

/* ---------------- ENVELOPE ---------------- */
#s0 .hdr{position:relative;top:auto;margin-bottom:6px}
.envwrap{position:relative;width:min(78vw,310px);aspect-ratio:3/2.1;margin:22px 0 18px;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 18px 22px var(--glow))}
.envwrap>*{position:absolute}
.eback{inset:0;border-radius:12px;background:linear-gradient(160deg,#ffc9db,#f79ab9)}
.eflap{left:0;right:0;top:0;height:62%;background:linear-gradient(#ffb4cb,#f27ea8);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .8s ease,z-index 0s .4s;z-index:5;border-radius:12px 12px 0 0}
.epaper{left:6%;right:6%;top:8%;height:82%;background:#fffafd;border-radius:8px;z-index:2;transition:transform 1.1s .6s cubic-bezier(.3,.9,.3,1);padding:12% 12%;display:flex;flex-direction:column;gap:10%;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.eline{height:3px;border-radius:3px;background:#f6b7cc}.eline.s{width:58%}
.efront{inset:0;z-index:3;border-radius:12px;background:linear-gradient(135deg,#ffd3e1,#f58fb2);clip-path:polygon(0 20%,50% 62%,100% 20%,100% 100%,0 100%)}
.seal{left:50%;top:44%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;z-index:6;transition:opacity .3s,transform .5s;background:radial-gradient(circle at 35% 30%,#ff9cc2,#d63f7c);box-shadow:0 4px 10px rgba(120,20,60,.35),inset 0 -3px 6px rgba(120,20,60,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.7rem;line-height:1;padding-bottom:2px}
.envwrap.open{animation:none}
.envwrap.open .eflap{transform:perspective(700px) rotateX(180deg);z-index:1}
.envwrap.open .epaper{transform:translateY(-64%)}
.envwrap.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
.tapme{font-weight:700;color:var(--soft);animation:beat 1.8s infinite;text-shadow:0 0 10px #fff;transition:opacity .4s}

/* ---------- aesthetic polish ---------- */
body,button,input,textarea{font-variant-emoji:text}
@keyframes halo{0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shimmerH{to{background-position:250% 0}}
.envwrap{width:min(80vw,320px)}
.envwrap::before{content:"";position:absolute;inset:-46px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,160,205,.38) 62%,transparent);z-index:-1;animation:halo 3.2s ease-in-out infinite}
.envwrap::after{content:"✧   ✦   ✧";position:absolute;left:-6%;right:-6%;top:-36px;text-align:center;white-space:pre;color:#fff;font-size:1.15rem;text-shadow:0 0 12px #ff8fb8,0 0 4px #ff8fb8;animation:twinkle 2.6s ease-in-out infinite}
.eback{background:linear-gradient(160deg,#ffdbe8,#f58fb3);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -16px 26px rgba(214,63,124,.18)}
.eflap{background:linear-gradient(#ffc6da,#f78fb4 70%,#ee79a4)}
.efront{background:linear-gradient(135deg,#ffe3ee,#f9a9c7 55%,#ef80a9);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.epaper{background:linear-gradient(#ffffff,#fff1f7)}
.seal{box-shadow:0 0 0 5px rgba(214,63,124,.22),0 6px 14px rgba(120,20,60,.4),inset 0 -3px 6px rgba(120,20,60,.3),inset 0 2px 3px rgba(255,255,255,.5);animation:beat 1.6s infinite}
.hdr h2{background:linear-gradient(110deg,var(--acc),#ff9ec7 35%,#c9a7ff 60%,var(--acc));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:shimmerH 7s linear infinite;filter:drop-shadow(0 2px 10px rgba(255,255,255,.95)) drop-shadow(0 0 14px rgba(255,150,200,.45))}
.hdr .small{text-shadow:0 0 10px rgba(255,255,255,.95)}
#s3::before{content:"";position:absolute;left:50%;top:40%;width:360px;height:360px;max-width:92vw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),rgba(255,170,215,.32) 60%,transparent);pointer-events:none;animation:halo 4s ease-in-out infinite}
.player,.letter,.wishbox,.panel{backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}

/* ---------------- LETTER ---------------- */
.letter{position:relative;width:100%;max-width:360px;max-height:100%;background:#fffafd;border-radius:6px 6px 16px 16px;padding:34px 22px 22px;text-align:left;box-shadow:0 22px 50px var(--glow);display:flex;flex-direction:column;overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(255,150,190,.3) 31px 32px);transform-origin:top center}
.screen.active .letter{animation:unfold 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{from{transform:perspective(900px) rotateX(-85deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.letter .tape{position:absolute;top:-4px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(-3deg);background:rgba(238,196,150,.8);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.letter h3{font-family:var(--script);font-weight:400;font-size:2.2rem;color:var(--acc);line-height:32px;margin-bottom:0}
.letter .txt{font-family:var(--hand);font-size:1.32rem;font-weight:500;line-height:32px;white-space:pre-wrap;overflow-y:auto;flex:1;color:#6b2c4b;max-height:52vh}
.letter .sig{font-family:var(--script);font-size:1.9rem;color:var(--acc);text-align:right;line-height:34px;opacity:0;transition:opacity 1s;margin-top:4px}
.letter .sig.show{opacity:1}
.fh{position:absolute;bottom:80px;color:#ff7eb0;pointer-events:none;animation:fhup 4s ease-out forwards;text-shadow:0 0 8px #fff}
@keyframes fhup{from{transform:translateY(0) scale(.6);opacity:.9}to{transform:translateY(-55vh) scale(1.3) rotate(25deg);opacity:0}}
.skipnote{position:absolute;bottom:84px;font-size:.78rem;font-weight:600;color:var(--soft);opacity:.8}

/* ---------------- GARDEN / DANDELION ---------------- */
#s2{touch-action:none;user-select:none;-webkit-user-select:none}
#gsvg,#dand{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#gsvg{pointer-events:none;overflow:hidden}
#ghint{position:absolute;left:0;right:0;top:46%;font-family:var(--script);font-size:2rem;color:var(--acc);text-shadow:0 0 14px #fff;pointer-events:none;transition:opacity .6s;animation:beat 2.4s infinite}
.gcount{position:absolute;left:0;right:0;top:128px;font-weight:700;font-size:.9rem;color:var(--soft);text-shadow:0 0 10px #fff;pointer-events:none;z-index:2}
.replant{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:5}
#dwish{position:absolute;left:16px;right:16px;bottom:96px;font-family:var(--script);font-size:2rem;color:var(--acc);text-shadow:0 0 14px #fff;opacity:0;transition:opacity 1s;pointer-events:none}

/* ---------------- PHOTOS ---------------- */
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;width:calc(100% + 32px);margin:0 -16px;padding:26px 14vw 30px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.ph{flex:0 0 min(62vw,250px);aspect-ratio:3/4;scroll-snap-align:center;background:#fff;padding:10px 10px 42px;border-radius:6px;box-shadow:0 14px 30px var(--glow);position:relative;cursor:pointer;transform:rotate(var(--r,0deg))}
.ph::before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(238,196,150,.8)}
.ph .im{width:100%;height:100%;border-radius:3px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:3.4rem;color:#fff;text-shadow:0 2px 12px rgba(224,86,140,.5)}
.ph .cap{position:absolute;bottom:8px;left:8px;right:8px;font-family:var(--hand);font-size:1.3rem;font-weight:600;color:#c2447a;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb{position:absolute;inset:0;background:rgba(70,10,40,.78);z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;backdrop-filter:blur(6px)}
#lb.show{display:flex}
#lb .big{width:min(90vw,420px);aspect-ratio:3/4;max-height:72vh;background:#fff;padding:12px 12px 54px;border-radius:8px;position:relative;animation:pop .35s}
#lb .im{width:100%;height:100%;border-radius:4px;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#ffe3ee;display:flex;align-items:center;justify-content:center;font-size:6rem;color:#fff}
#lb .cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--hand);font-size:1.7rem;font-weight:600;color:#c2447a}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* ---------------- MUSIC ---------------- */
.player{position:relative;width:100%;max-width:360px;padding:22px 18px 18px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--cardb);border-radius:28px;box-shadow:0 16px 44px var(--glow);margin-top:30px}
.orn{font-size:.85rem;letter-spacing:.35em;color:var(--acc2);margin-bottom:10px;opacity:.9}
.disc{width:124px;height:124px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle,#fff 0 10%,#ffb3cf 11% 26%,#e0568c 27% 58%,#ff8fb8 59% 70%,#c2447a 71%);box-shadow:0 12px 28px var(--glow);display:flex;align-items:center;justify-content:center;font-size:1.9rem;color:#e0568c;animation:spin 7s linear infinite;animation-play-state:paused}
.disc.play{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;gap:4px;height:22px;align-items:flex-end;justify-content:center;margin-bottom:8px}
.eq i{width:5px;border-radius:3px;background:var(--acc);height:5px}
.eq.play i{animation:eq .9s infinite ease-in-out alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{to{height:22px}}
.tt{font-weight:700;font-size:1.1rem}.ta{font-size:.82rem;color:var(--soft);margin-bottom:6px}
.bar{height:6px;border-radius:6px;background:rgba(224,86,140,.2);overflow:hidden;margin:8px 4px 12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.ctrl{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:8px}
.ctrl button{border:1px solid var(--cardb);background:rgba(255,255,255,.7);color:var(--acc);width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ctrl button svg{width:48%;height:48%;fill:currentColor}
.ctrl button.main{width:62px;height:62px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0;box-shadow:0 8px 20px var(--glow)}
.ctrl button.main svg{width:44%;height:44%}
.list{list-style:none;text-align:left;max-height:120px;overflow:auto}
.list li{padding:9px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.92rem;display:flex;gap:10px;align-items:center}
.list li .ni{color:var(--acc2);width:1em;text-align:center}
.list li .nd{margin-left:auto;color:var(--acc2);opacity:0}
.list li.on{background:rgba(255,126,176,.25)}
.list li.on .nd{opacity:1}

/* ---------------- TULIP ---------------- */
.tulipbox{position:absolute;left:0;right:0;bottom:70px;height:66%}
#tsvg{width:100%;height:100%;overflow:visible}
#tsvg .stem{stroke-dasharray:1;stroke-dashoffset:1}
#tsvg.play .stem{animation:draw 3.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#tsvg .leaf{opacity:0;transform:scale(0)}
#tsvg.play .leaf{animation:lg 1.7s ease-out forwards}
@keyframes lg{from{transform:scale(0,.1);opacity:0}to{transform:scale(1);opacity:1}}
#tsvg .head{transform-origin:0 0;transform:scale(0)}
#tsvg.play .head{animation:hg 1.1s ease-out forwards}
@keyframes hg{from{transform:scale(0)}to{transform:scale(1)}}
#tsvg .pL,#tsvg .pR,#tsvg .pC{transform-origin:0 0}
#tsvg .pL{transform:rotate(32deg) scale(.85)}#tsvg .pR{transform:rotate(-32deg) scale(.85)}#tsvg .pC{transform:scale(.8,.9)}
#tsvg.play .pL{animation:oL 1.7s cubic-bezier(.3,1.35,.5,1) forwards}
#tsvg.play .pR{animation:oR 1.7s cubic-bezier(.3,1.35,.5,1) forwards}
#tsvg.play .pC{animation:oC 1.7s cubic-bezier(.3,1.35,.5,1) forwards}
@keyframes oL{to{transform:rotate(-9deg) scale(1)}}@keyframes oR{to{transform:rotate(9deg) scale(1)}}@keyframes oC{to{transform:scale(1)}}
#tsvg .halo,#tsvg .tw{opacity:0}
#tsvg.bloomed .halo{animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
#tsvg .halo{transform-box:fill-box;transform-origin:center}
#tsvg.bloomed .tw{animation:tw 1.8s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
#tsvg .tw{transform-box:fill-box;transform-origin:center}
.wishbox{position:absolute;left:14px;right:14px;top:62px;max-height:40%;overflow-y:auto;z-index:6;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity 1s,transform 1s,visibility 1s;padding:14px 16px;border-radius:26px;background:rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--cardb);box-shadow:0 14px 40px var(--glow)}
.wishbox.show{opacity:1;visibility:visible;transform:none}
.wishbox h2{font-family:var(--script);font-weight:400;font-size:clamp(2.2rem,9.5vw,3rem);line-height:1.05;background:linear-gradient(110deg,#e0568c,#ff9ec7,#d6a4ff,#e0568c);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;padding:0 4px 4px}
@keyframes shine{to{background-position:250% 0}}
.wishbox p{font-weight:600;font-size:.92rem;line-height:1.5;margin-top:6px}
.wishbox .row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* Tiny QR encoder (byte mode, versions 1-10, ECC L/M/Q/H) — no external library */
const QR=(function(){

    [[7,1,19,0,0],[10,1,16,0,0],[13,1,13,0,0],[17,1,9,0,0]],
    [[10,1,34,0,0],[16,1,28,0,0],[22,1,22,0,0],[28,1,16,0,0]],
    [[15,1,55,0,0],[26,1,44,0,0],[18,2,17,0,0],[22,2,13,0,0]],
    [[20,1,80,0,0],[18,2,32,0,0],[26,2,24,0,0],[16,4,9,0,0]],
    [[26,1,108,0,0],[24,2,43,0,0],[18,2,15,2,16],[22,2,11,2,12]],
    [[18,2,68,0,0],[16,4,27,0,0],[24,4,19,0,0],[28,4,15,0,0]],
    [[20,2,78,0,0],[18,4,31,0,0],[18,2,14,4,15],[26,4,13,1,14]],
    [[24,2,97,0,0],[22,2,38,2,39],[22,4,18,2,19],[26,4,14,2,15]],
    [[30,2,116,0,0],[22,3,36,2,37],[20,4,16,4,17],[24,4,12,4,13]],
    [[18,2,68,2,69],[26,4,43,1,44],[24,6,19,2,20],[28,6,15,2,16]]
  ];
  const ALIGN=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
  (function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
  const mul=(a,b)=>(a&&b)?EXP[LOG[a]+LOG[b]]:0;
  function gen(n){let p=[1];for(let i=0;i<n;i++){const q=new Array(p.length+1).fill(0);for(let j=0;j<p.length;j++){q[j]^=p[j];q[j+1]^=mul(p[j],EXP[i]);}p=q;}return p;}
  function rem(data,n){const g=gen(n),r=new Array(n).fill(0);for(const d of data){const f=d^r[0];r.shift();r.push(0);if(f)for(let i=0;i<n;i++)r[i]^=mul(g[i+1],f);}return r;}
  const bit=(v,i)=>((v>>>i)&1)===1;
  const MASKS=[
    (r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,
    (r,c)=>(((r/2)|0)+((c/3)|0))%2===0,(r,c)=>((r*c)%2)+((r*c)%3)===0,
    (r,c)=>(((r*c)%2)+((r*c)%3))%2===0,(r,c)=>(((r+c)%2)+((r*c)%3))%2===0
  ];
  function make(text,level,force){
    const li={L:0,M:1,Q:2,H:3}[level],fb={L:1,M:0,Q:3,H:2}[level];
    if(li===undefined)return null;
    const bytes=Array.from(new TextEncoder().encode(text));
    let ver=0,cfg=null;
    for(let v=1;v<=10;v++){const c=EC[v-1][li],d=c[1]*c[2]+c[3]*c[4],cb=v<10?8:16;if(4+cb+bytes.length*8<=d*8){ver=v;cfg=c;break;}}
    if(!ver)return null;
    const dcw=cfg[1]*cfg[2]+cfg[3]*cfg[4],cb=ver<10?8:16,bits=[];
    const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>i)&1);};
    put(4,4);put(bytes.length,cb);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,dcw*8-bits.length));while(bits.length%8)bits.push(0);
    for(let p=0;bits.length<dcw*8;p++)put(p%2?0x11:0xEC,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let k=0;k<8;k++)b=(b<<1)|bits[i+k];data.push(b);}
    const blocks=[],ecs=[];let pos=0;
    for(let g=0;g<2;g++){const nb=g?cfg[3]:cfg[1],nd=g?cfg[4]:cfg[2];for(let b=0;b<nb;b++){const d=data.slice(pos,pos+nd);pos+=nd;blocks.push(d);ecs.push(rem(d,cfg[0]));}}
    const out=[],maxd=Math.max.apply(null,blocks.map(b=>b.length));
    for(let i=0;i<maxd;i++)blocks.forEach(b=>{if(i<b.length)out.push(b[i]);});
    for(let i=0;i<cfg[0];i++)ecs.forEach(e=>out.push(e[i]));
    const all=[];out.forEach(b=>{for(let i=7;i>=0;i--)all.push((b>>i)&1);});
    const n=17+4*ver,M=[],F=[];
    for(let i=0;i<n;i++){M.push(new Array(n).fill(false));F.push(new Array(n).fill(false));}
    const set=(r,c,v)=>{if(r<0||c<0||r>=n||c>=n)return;M[r][c]=!!v;F[r][c]=true;};
    function finder(r0,c0){for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const on=dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4));set(r0+dr,c0+dc,on);}}
    finder(0,0);finder(0,n-7);finder(n-7,0);
    for(let i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
    const AL=ALIGN[ver-1],last=AL[AL.length-1];
    for(const r of AL)for(const c of AL){
      if((r===6&&c===6)||(r===6&&c===last)||(r===last&&c===6))continue;
      for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1);
    }
    function drawFormat(mask){
      const d=(fb<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
      const b=((d<<10)|r)^0x5412;
      for(let i=0;i<=5;i++)set(i,8,bit(b,i));
      set(7,8,bit(b,6));set(8,8,bit(b,7));set(8,7,bit(b,8));
      for(let i=9;i<15;i++)set(8,14-i,bit(b,i));
      for(let i=0;i<8;i++)set(8,n-1-i,bit(b,i));
      for(let i=8;i<15;i++)set(n-15+i,8,bit(b,i));
      set(n-8,8,true);
    }
    drawFormat(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;
      for(let i=0;i<18;i++){const a=n-11+(i%3),k=(i/3)|0;set(k,a,bit(b,i));set(a,k,bit(b,i));}}
    let bi=0;
    for(let right=n-1;right>=1;right-=2){
      if(right===6)right=5;
      for(let v=0;v<n;v++)for(let j=0;j<2;j++){
        const c=right-j,up=((right+1)&2)===0,r=up?n-1-v:v;
        if(!F[r][c]&&bi<all.length){M[r][c]=all[bi]===1;bi++;}
      }
    }
    function penalty(G){
      let p=0;
      for(let t=0;t<2;t++){
        for(let a=0;a<n;a++){
          let run=1,hist='';
          for(let b=0;b<n;b++){
            const cur=t?G[b][a]:G[a][b],prev=b?(t?G[b-1][a]:G[a][b-1]):null;
            hist+=cur?'1':'0';
            if(b&&cur===prev){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;
          }
          const m=hist.match(/10111010000|00001011101/g);if(m)p+=m.length*40;
        }
      }
      for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++){const v=G[r][c];if(v===G[r][c+1]&&v===G[r+1][c]&&v===G[r+1][c+1])p+=3;}
      let dark=0;for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(G[r][c])dark++;
      p+=Math.floor(Math.abs(dark*100/(n*n)-50)/5)*10;
      return p;
    }
    let best=null,bestP=1e9,bestMask=0;
    for(let m=0;m<8;m++){
      const G=M.map(r=>r.slice());
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!F[r][c]&&MASKS[m](r,c))G[r][c]=!G[r][c];
      const saveM=M.map(r=>r.slice());
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)M[r][c]=G[r][c];
      drawFormat(m);
      const G2=M.map(r=>r.slice());
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)M[r][c]=saveM[r][c];
      const p=penalty(G2);
      if(force!==undefined?m===force:p<bestP){bestP=p;best=G2;bestMask=m;}
    }
    return{n:n,version:ver,level:level,mask:bestMask,isDark:(r,c)=>best[r][c]};
  }
  return{make:make};
})();

function sceneHTML(bg,opt={}){

   CONFETTI
   ===================================================================== */
const Confetti=(function(){
  const c=$('#confetti'),x=c.getContext('2d');let W,H,ps=[],run=false;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}
  size();addEventListener('resize',size);
  function heart(px,py,s){x.beginPath();x.moveTo(px,py+s*.3);x.bezierCurveTo(px,py-s*.2,px-s,py-s*.2,px-s,py+s*.35);x.bezierCurveTo(px-s,py+s*.8,px,py+s*1.05,px,py+s*1.35);x.bezierCurveTo(px,py+s*1.05,px+s,py+s*.8,px+s,py+s*.35);x.bezierCurveTo(px+s,py-s*.2,px,py-s*.2,px,py+s*.3);x.fill();}
  function burst(n){for(let i=0;i<n;i++)ps.push({x:W/2+rand(-40,40),y:H*.5,vx:rand(-7,7),vy:rand(-14,-4),g:.22,r:rand(5,11),c:pick(PINKS.concat(['#ffd166','#c9a7ff'])),h:Math.random()<.5,rot:rand(0,6),vr:rand(-.2,.2),a:1});if(!run){run=true;loop();}}
  function loop(){x.clearRect(0,0,W,H);ps=ps.filter(p=>p.y<H+30&&p.a>0);
    ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;if(p.y>H*.9)p.a-=.03;x.save();x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;x.translate(p.x,p.y);x.rotate(p.rot);if(p.h)heart(0,-p.r/2,p.r*.7);else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(ps.length)requestAnimationFrame(loop);else{run=false;x.clearRect(0,0,W,H);}}
  return{burst};
})();

/* =====================================================================
   MUSIC  (soothing ambient pads + soft chimes, or the songs you chose)
   ===================================================================== */
const Music=(function(){
  const SYN=[
    {title:"Calm Morning",bpm:48,seed:7,chords:[[48,55,59,64],[45,52,57,60],[41,48,57,60],[43,50,55,59]],scale:[72,74,76,79,81,84]},
    {title:"Soft Rain Lullaby",bpm:44,seed:19,chords:[[50,57,61,66],[47,54,59,62],[43,50,54,59],[45,52,57,61]],scale:[74,76,78,81,83,86]},
    {title:"Gentle Waves",bpm:40,seed:31,waves:true,chords:[[41,48,52,57],[46,53,57,62],[38,50,53,57],[48,52,55,57]],scale:[69,72,74,77,79,81]}
  ];
  let actx,master,an,tg=null,au=null,tracks=[],idx=0,playing=false,started=false,sS=0,sD=1,raf=0,ui={};
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function ctx(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.9;
    an=actx.createAnalyser();an.fftSize=512;master.connect(an);
    const d=actx.createDelay();d.delayTime.value=.47;const fb=actx.createGain();fb.gain.value=.45;const wet=actx.createGain();wet.gain.value=.4;
    master.connect(actx.destination);master.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(actx.destination);}
    if(actx.state==='suspended')actx.resume();}
  function pad(dest,f,t,d){const g=actx.createGain(),lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.3;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+2.4);g.gain.setValueAtTime(.05,t+d-2.6);g.gain.linearRampToValueAtTime(.0001,t+d);lp.connect(g);g.connect(dest);
    [[f,0,'sine'],[f,5,'sine'],[f/2,-3,'triangle']].forEach(([fr,c,ty])=>{const o=actx.createOscillator();o.type=ty;o.frequency.value=fr;o.detune.value=c;o.connect(lp);o.start(t);o.stop(t+d+.1);});}
  function chime(dest,f,t,d,v){const g=actx.createGain(),o=actx.createOscillator(),o2=actx.createOscillator(),g2=actx.createGain();o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.01;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);g2.gain.value=.22;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(dest);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1);}
  function waves(dest,t,d){const n=Math.floor(actx.sampleRate*6),b=actx.createBuffer(1,n,actx.sampleRate),a=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;a[i]=l*3.5;}
    const s=actx.createBufferSource();s.buffer=b;s.loop=true;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;const g=actx.createGain();g.gain.value=.07;
    const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.11;lg.gain.value=.055;lfo.connect(lg);lg.connect(g.gain);s.connect(lp);lp.connect(g);g.connect(dest);s.start(t);lfo.start(t);s.stop(t+d);lfo.stop(t+d);}
  function halt(){if(tg){try{tg.gain.value=0;tg.disconnect();}catch(e){}tg=null;}if(au){au.onended=null;au.pause();au.removeAttribute('src');au=null;}if(actx&&actx.state==='suspended')actx.resume();}
  function load(i){
    if(!tracks.length)return;idx=(i+tracks.length)%tracks.length;halt();const t=tracks[idx];
    if(t.kind==='synth'){ctx();tg=actx.createGain();tg.connect(master);sS=actx.currentTime+.2;
      const spb=60/t.bpm,cb=8,reps=2;let seed=t.seed||7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
      for(let r=0;r<reps;r++)t.chords.forEach((ch,k)=>{const st=sS+(r*t.chords.length+k)*cb*spb,len=cb*spb;
        ch.forEach((m,j)=>pad(tg,mtof(m),st+j*.25,len+2.5));
        [1,2.5,4,5.5,7].forEach(b=>{if(rnd()<.8)chime(tg,mtof(t.scale[(rnd()*t.scale.length)|0]),st+b*spb+rnd()*.3,5,.07);});});

  }
  function toggle(){
    if(!started){load(idx);return;}
    const t=tracks[idx];if(!t)return;

  function tick(){let p=0;const t=tracks[idx];

})();

function mountCard(data,opts={}){
  token++;const T=token;D=data;PREVIEW=!!opts.preview;cur=0;Music.destroy();
  ORDER=[0,1,2,3];if(D.sample||(D.photos&&D.photos.length))ORDER.push(4);ORDER.push(5,6);
  $('#editor').classList.add('hidden');$('#loading').classList.add('hidden');$('#modal').classList.add('hidden');$('#card').classList.remove('hidden');
  setScene(D.bg);$('#card').innerHTML=cardTpl();
  $('#envTo').textContent=D.to||'you';
  $('#makeBtn').textContent=PREVIEW?'‹ back to editing':'✧ make your own';
  $('#makeBtn').onclick=openEditor;$('#makeBtn2').onclick=openEditor;
  $('#dots').innerHTML=ORDER.slice(1).map(()=>'<i></i>').join('');
  $('#prevBtn').onclick=()=>go(ORDER[ORDER.indexOf(cur)-1]);$('#nextBtn').onclick=()=>go(ORDER[ORDER.indexOf(cur)+1]);
  $('#replay').onclick=()=>{if(cur===6){H.tulipReset();H.tulip();}};
  initEnvelope(T);initLetter(T);initGarden(T);initDand(T);initPhotos(T);initMusic(T);initTulip(T);
  go(0);
}
function go(i){
  if(i===undefined||!ORDER.includes(i))return;const prev=cur;cur=i;const pos=ORDER.indexOf(i);
  $$('#card .screen').forEach((s,k)=>s.classList.toggle('active',k===i));
  $('#nav').classList.toggle('hidden',i===0);
  $('#prevBtn').style.visibility=pos<=1?'hidden':'visible';
  $('#nextBtn').style.visibility=pos>=ORDER.length-1?'hidden':'visible';
  $$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===pos-1));
  if(i===1&&H.letter)H.letter();
  if(prev===6&&i!==6&&H.tulipReset)H.tulipReset();
  if(i===6&&H.tulip)H.tulip();
}

function initEnvelope(T){
  const w=$('#envwrap');let opened=false;
  w.addEventListener('click',()=>{if(opened)return;opened=true;w.classList.add('open');$('#tapme').style.opacity=0;Music.play();
    setTimeout(()=>{if(T===token&&cur===0)go(1);},2400);});
}
function initLetter(T){
  const to=D.to||'you',txt=$('#ltxt'),full=D.letter||'',scr=$('#s1');let started=false,i=0,timer=0;
  $('#ltitle').textContent=`Dear ${to},`;$('#lsig').textContent=`With all my love, ${D.from||'someone special'} ♡`;
  const done=()=>$('#lsig').classList.add('show');
  function step(){if(T!==token)return;i++;txt.textContent=full.slice(0,i);txt.scrollTop=txt.scrollHeight;
    if(i<full.length)timer=setTimeout(step,full[i-1]==='\n'?200:/[.,!?]/.test(full[i-1])?120:26);else done();}
  H.letter=()=>{if(started)return;started=true;setTimeout(step,900);};
  $('#letter').addEventListener('click',()=>{if(started&&i<full.length){i=full.length;clearTimeout(timer);txt.textContent=full;done();}});
  const iv=setInterval(()=>{if(T!==token){clearInterval(iv);return;}if(cur!==1)return;const h=document.createElement('span');h.className='fh';h.textContent=pick(['❥','♡','✦','✧']);h.style.left=rand(8,88)+'%';h.style.fontSize=rand(14,26)+'px';scr.appendChild(h);setTimeout(()=>h.remove(),4000);},800);
}

function initGarden(T){
  const scr=$('#s2'),svg=$('#gsvg');
  let count=0,bag=[],planted=[],down=false,lx=0,ly=0;
  const STEM=['#6bb283','#5aa86f','#7cc59a','#8cc39a','#68b08c'];
  const nextSpec=()=>{if(!bag.length)bag=FLOWERS.slice().sort(()=>Math.random()-.5);return bag.pop();};
  const SPARK='M0-7L1.8-1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8-1.8Z';

    s.animate([{transform:`translate(${x}px,${y}px) scale(0)`,opacity:0},{transform:`translate(${x+dx}px,${y+dy}px) scale(1) rotate(60deg)`,opacity:1,offset:.4},{transform:`translate(${x+dx*1.5}px,${y+dy*1.5}px) scale(0) rotate(140deg)`,opacity:0}],{duration:1300,delay,easing:'ease-out',fill:'both'}).onfinish=()=>s.remove();
  }
  function fall(p,x,y,col,delay,hh){

    for(let k=0;k<3;k++){const gh=rand(14,30),gx=(k-1)*rand(5,11),b=SV('path',{d:`M${gx} 0Q${gx+rand(-8,8)} ${-gh*.5} ${gx+rand(-12,12)} ${-gh}`,fill:'none',stroke:stemCol,'stroke-width':2,'stroke-linecap':'round',pathLength:1,opacity:.85},g);
      b.style.strokeDasharray=1;b.style.strokeDashoffset=1;b.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:600,delay:dl+k*80,easing:'ease-out',fill:'forwards'});}

      lf.style.transformOrigin='0px 0px';lf.animate([{transform:'scale(0)'},{transform:'scale(1)'}],{duration:520,delay:dl+450+i*150,easing:'ease-out',fill:'backwards'});});

  const motes=Array.from({length:26},()=>({x:rand(0,300),y:rand(0,500),r:rand(1,2.8),ph:rand(0,6.28),v:rand(.12,.4)}));
  function fluff(px,py,rot,len,al){x.save();x.translate(px,py);x.rotate(rot);x.globalAlpha=al;x.strokeStyle='#fff';x.lineWidth=1.2;x.shadowColor='rgba(255,214,238,.95)';x.shadowBlur=14;
    x.beginPath();x.moveTo(0,0);x.lineTo(len,0);x.stroke();x.translate(len,0);x.beginPath();for(let k=0;k<9;k++){const a=-1.4+k*.35;x.moveTo(0,0);x.lineTo(Math.cos(a)*11,Math.sin(a)*11);}x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(0,0,1.9,0,6.3);x.fill();x.restore();}
  function release(s,vx,vy){if(s.gone)return;s.gone=true;released++;
    parts.push({x:cx+Math.cos(s.a)*R*s.l*grow,y:cy+Math.sin(s.a)*R*s.l*grow,rot:s.a,vx,vy,a:1,w:rand(0,6.28),sp:rand(.02,.06)});
    if(released===seeds.length){const w=$('#dwish');const ws=(D.wishes&&D.wishes.length)?D.wishes:DEFAULT_WISHES;w.textContent=ws[wi++%ws.length];w.style.opacity=1;setTimeout(()=>{w.style.opacity=0;},3800);clearTimeout(regrowT);regrowT=setTimeout(()=>{if(T===token)make();},4500);}}
  c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),px=e.clientX-r.left,dir=px<cx?1:-1;
    seeds.forEach(s=>{if(s.gone)return;setTimeout(()=>release(s,dir*rand(1.4,4)+rand(-.5,.5),rand(-2,-.2)),rand(0,700));});});
  c.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&!e.buttons)return;const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    if(Math.hypot(px-cx,py-cy)<R+25)seeds.forEach(s=>{if(s.gone)return;const sx=cx+Math.cos(s.a)*R*s.l,sy=cy+Math.sin(s.a)*R*s.l;if(Math.hypot(px-sx,py-sy)<45)release(s,rand(1.2,3),rand(-1.8,-.3));});});
  let t=0;
  (function loop(){if(T!==token)return;t+=.02;
    if(cur===3){x.clearRect(0,0,W,Hh);if(grow<1)grow=Math.min(1,grow+.02);
      x.shadowBlur=0;const gl=x.createRadialGradient(cx,cy,0,cx,cy,R*2.3);gl.addColorStop(0,'rgba(255,255,255,.75)');gl.addColorStop(.4,'rgba(255,190,225,.38)');gl.addColorStop(1,'rgba(255,170,215,0)');
      x.globalAlpha=.78+.22*Math.sin(t*1.7);x.fillStyle=gl;x.fillRect(0,0,W,Hh);x.globalAlpha=1;
      motes.forEach(m=>{m.y-=m.v;m.x+=Math.sin(t+m.ph)*.3;if(m.y<-10){m.y=Hh+10;m.x=rand(0,W);}if(m.x>W+10)m.x=-10;
        x.globalAlpha=.35+.55*Math.abs(Math.sin(t*1.3+m.ph));x.shadowColor='rgba(255,255,255,.95)';x.shadowBlur=12;x.fillStyle='#fff';x.beginPath();x.arc(m.x,m.y,m.r,0,6.3);x.fill();});
      x.shadowBlur=0;x.globalAlpha=1;
      x.shadowBlur=0;x.strokeStyle='#5aa86f';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(cx,cy+6);x.quadraticCurveTo(cx+10,Hh*.72,cx+34,Hh+4);x.stroke();
      x.fillStyle='#7bcb93';x.beginPath();x.moveTo(cx+16,Hh*.76);x.quadraticCurveTo(cx+76,Hh*.64,cx+90,Hh*.7);x.quadraticCurveTo(cx+54,Hh*.84,cx+16,Hh*.76);x.fill();
      const sway=Math.sin(t)*1.2;
      seeds.forEach(s=>{if(s.gone)return;const L=R*s.l*grow,px=cx+Math.cos(s.a)*L+sway,py=cy+Math.sin(s.a)*L;x.globalAlpha=1;x.shadowBlur=0;x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=1;x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke();fluff(px-Math.cos(s.a)*10,py-Math.sin(s.a)*10,s.a,10,1);});
      x.globalAlpha=1;x.shadowBlur=0;x.fillStyle='#c98a5a';x.beginPath();x.arc(cx,cy,8,0,6.3);x.fill();
      parts=parts.filter(p=>p.a>0&&p.x<W+40&&p.y>-40);
      parts.forEach(p=>{p.w+=p.sp;p.vx*=.995;p.x+=p.vx+Math.sin(p.w)*.6;p.y+=p.vy+Math.cos(p.w*1.3)*.4;p.vy-=.004;p.rot+=Math.sin(p.w)*.02;p.a-=.0035;fluff(p.x,p.y,p.rot,10,Math.max(p.a,0));});}
    requestAnimationFrame(loop);})();
}

function tulipMarkup(){
  const defs=`<defs><linearGradient id="tpA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd1e3"/><stop offset="1" stop-color="#ee6a9f"/></linearGradient>
  <linearGradient id="tpB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ee"/><stop offset=".55" stop-color="#ff8fb8"/><stop offset="1" stop-color="#e0568c"/></linearGradient>
  <linearGradient id="tlf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4f9a67"/><stop offset="1" stop-color="#a4dcae"/></linearGradient>
  <radialGradient id="tHalo"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#ffb3d1" stop-opacity=".45"/><stop offset="1" stop-color="#ffb3d1" stop-opacity="0"/></radialGradient></defs>`;
  function one(x,top,base,s,d,lean){
    const Hh=base-top;
    const stem=`<path class="stem" pathLength="1" style="animation-delay:${d}s" d="M${x} ${base}C${x+lean} ${base-Hh*.35} ${x-lean} ${base-Hh*.72} ${x} ${top+6}" stroke="#58a56e" stroke-width="${7*s}" fill="none" stroke-linecap="round"/>`;
    const L=`M${x} ${base}C${x-30} ${base-Hh*.18} ${x-80} ${base-Hh*.4} ${x-66} ${base-Hh*.68}C${x-38} ${base-Hh*.48} ${x-8} ${base-Hh*.32} ${x} ${base-Hh*.05}Z`;
    const R=`M${x} ${base}C${x+30} ${base-Hh*.14} ${x+84} ${base-Hh*.32} ${x+70} ${base-Hh*.56}C${x+40} ${base-Hh*.4} ${x+8} ${base-Hh*.26} ${x} ${base-Hh*.04}Z`;
    const leaves=`<path class="leaf" style="transform-origin:${x}px ${base}px;animation-delay:${d+1.3}s" d="${L}" fill="url(#tlf)"/><path class="leaf" style="transform-origin:${x}px ${base}px;animation-delay:${d+1.6}s" d="${R}" fill="url(#tlf)"/>`;
    const head=`<g transform="translate(${x} ${top}) scale(${s})"><g class="head" style="animation-delay:${d+2.7}s">
      <circle class="halo" cx="0" cy="-72" r="105" fill="url(#tHalo)"/>
      <path d="M-15 10Q0 24 15 10Q0 0 -15 10Z" fill="#58a56e"/>
      <path class="pL" style="animation-delay:${d+3.2}s" d="M0 0C-45-4-62-62-50-127C-25-102-2-72 0 0Z" fill="url(#tpA)"/>
      <path class="pR" style="animation-delay:${d+3.2}s" d="M0 0C45-4 62-62 50-127C25-102 2-72 0 0Z" fill="url(#tpA)"/>
      <g class="pC" style="animation-delay:${d+3.3}s"><path d="M0 8C-42 0-46-72 0-142C46-72 42 0 0 8Z" fill="url(#tpB)"/>
      <path d="M-14-18C-26-58-14-100 0-126" stroke="#fff" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M12-14C22-50 14-86 4-112" stroke="#c2447a" stroke-opacity=".25" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></g></g>`;
    return stem+leaves+head;
  }
  const stars=[[110,70,1.4],[300,95,1.1],[150,20,1],[255,30,1.5],[70,170,.9],[335,190,1.2],[200,-5,1.1]].map((p,i)=>`<g class="tw" style="animation-delay:${i*.35}s">${spark(p[0],p[1]+40,p[2],'#ff9ec7')}</g>`).join('');
  return defs+one(95,430,700,.7,.5,6)+one(305,380,700,.8,1,-6)+one(200,190,700,1,0,8)+stars;
}

function compress(file,max,q){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h){URL.revokeObjectURL(u);return rej(new Error('size'));}const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('compress'));},'image/jpeg',q);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('read'));};img.src=u;});}
const AUDIO_TYPES={mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',webm:'audio/webm',flac:'audio/flac'};
function audioMeta(f){const m=/\.([a-z0-9]+)$/i.exec(f.name||'');let ext=m?m[1].toLowerCase():'';
  if(!AUDIO_TYPES[ext]){const t=(f.type||'').toLowerCase();ext=t.includes('mpeg')||t.includes('mp3')?'mp3':t.includes('mp4')||t.includes('m4a')?'m4a':t.includes('wav')?'wav':t.includes('ogg')?'ogg':t.includes('aac')?'aac':t.includes('webm')?'webm':t.includes('flac')?'flac':'';}
  if(ext==='mp4')ext='m4a';if(ext==='oga'||ext==='opus')ext='ogg';
  return ext&&AUDIO_TYPES[ext]?{ext,type:AUDIO_TYPES[ext]}:null;}

const API={

  h(extra){const h={apikey:CONFIG.SUPABASE_ANON_KEY};if(/^eyJ/.test(CONFIG.SUPABASE_ANON_KEY))h.Authorization='Bearer '+CONFIG.SUPABASE_ANON_KEY;return Object.assign(h,extra||{});},
  async fail(r){let m='HTTP '+r.status;try{const j=await r.json();m=j.message||j.error_description||j.msg||j.error||m;}catch(e){}return new Error(m);},
  async getCard(id){const r=await fetch(this.base()+'/rest/v1/rpc/get_card',{method:'POST',headers:this.h({'Content-Type':'application/json'}),body:JSON.stringify({card_id:id})});if(!r.ok)throw await this.fail(r);return r.json();},
  async insertCard(id,data){const r=await fetch(this.base()+'/rest/v1/cards',{method:'POST',headers:this.h({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({id,data})});if(!r.ok)throw await this.fail(r);},
  async upload(path,blob){const fd=new FormData();fd.append('cacheControl','31536000');fd.append('',blob);
    const r=await fetch(`${this.base()}/storage/v1/object/${CONFIG.BUCKET}/${path}`,{method:'POST',headers:this.h({'x-upsert':'false'}),body:fd});if(!r.ok)throw await this.fail(r);},
  pub:path=>`${API.base()}/storage/v1/object/public/${CONFIG.BUCKET}/${path}`
};

/* =====================================================================
   SHARE  (upload > short link + pink QR)
   ===================================================================== */
const genId=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
const b64e=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
function shareBase(){
  if(/^https?:$/.test(location.protocol))return location.origin+location.pathname.replace(/index\.html$/,'');
  try{const b=new URL(CONFIG.SHARE_BASE);return b.origin+b.pathname;}catch(e){return 'https://petalnote.vercel.app/';}
}

function showModal(html,closable=true){const m=$('#modal');m.classList.remove('hidden');m.innerHTML=`<div class="mbox">${closable?'<button class="mx" id="mx" aria-label="Close">✕</button>':''}${html}</div>`;if(closable)$('#mx').onclick=()=>m.classList.add('hidden');}

function setupNeeded(d){
  showModal(`<h3>one-time setup ✧</h3><p class="note" style="margin-top:0">Photos and songs can only travel inside a link once Supabase is connected.<br>Run <b>supabase.sql</b>, then paste your Project URL and anon key into the <b>CONFIG</b> at the top of <b>index.html</b>.</p>
    <p class="note">You can still share your words and theme right now:</p><div class="mrow" style="margin-top:10px"><button class="btn small" id="txtOnly">share words & theme only</button></div>`);
  $('#txtOnly').onclick=()=>{
    const slim={v:2,to:d.to,from:d.from,letter:d.letter,wishes:d.wishes,finalMsg:d.finalMsg,bg:{type:d.bg.type==='custom'?'sky':d.bg.type},photos:[],songs:[]};
    showShare(shareBase()+'?d='+b64e(slim),'Text-only link: it carries your letter, wishes and theme, but not photos or songs.');};
}
async function createLink(){
  const d=buildData();
  if(!SB_ON)return setupNeeded(d);
  showModal(`<h3>creating your surprise ♡</h3><p class="note" id="mMsg" style="margin-top:0">getting things ready…</p><div class="pbar"><i id="mBar"></i></div>`,false);
  try{
    let id=null;
    for(let k=0;k<6&&!id;k++){const c=genId();if(!(await API.getCard(c)))id=c;}
    if(!id)throw new Error('could not reserve a link, please try again');
    const out=JSON.parse(JSON.stringify(d)),tasks=[];
    if(ED.bg.type==='custom'&&ED.custom)tasks.push({path:`${id}/bg.jpg`,body:ED.custom.blob,set:u=>{out.bg={type:'custom',url:u};}});
    ED.photos.forEach((p,i)=>tasks.push({path:`${id}/photo-${i}.jpg`,body:p.blob,set:u=>{out.photos[i].url=u;}}));
    ED.songs.forEach((s,i)=>{const m=audioMeta(s.file);tasks.push({path:`${id}/song-${i}.${m.ext}`,body:new Blob([s.file],{type:m.type}),set:u=>{out.songs[i].url=u;}});});
    let done=0;const total=tasks.length,q=tasks.slice();
    const prog=()=>{const m=$('#mMsg'),b=$('#mBar');if(m)m.textContent=total?`uploading ${done} of ${total}…`:'saving…';if(b)b.style.width=(total?done/total*100:60)+'%';};
    prog();
    const run=async t=>{let err=null;
      for(let a=0;a<3;a++){try{await API.upload(t.path,t.body);err=null;break;}catch(e){err=e;if(a>0&&/already exists|duplicate/i.test(e.message)){err=null;break;}await sleep(600*(a+1));}}
      if(err)throw new Error(`${t.path.split('/').pop()}: ${err.message}`);t.set(API.pub(t.path));done++;prog();};
    await Promise.all(Array.from({length:Math.min(3,q.length)},async()=>{while(q.length)await run(q.shift());}));
    $('#mMsg').textContent='saving your card…';$('#mBar').style.width='100%';
    await API.insertCard(id,out);
    const back=await API.getCard(id);
    if(!back||back.letter!==out.letter||back.to!==out.to||back.from!==out.from||(back.photos||[]).length!==out.photos.length||(back.songs||[]).length!==out.songs.length)throw new Error('the saved card did not match what you edited, please try again');
    showShare(shareBase()+'?'+id,`saved ✧ your letter, ${out.photos.length} photo${out.photos.length===1?'':'s'}, ${out.songs.length} song${out.songs.length===1?'':'s'} and your theme travel inside this link.`);
  }catch(err){
    showModal(`<h3>oh no ♡</h3><p class="note" style="margin-top:0">Something went wrong while saving:<br><b>${esc(err&&err.message||err)}</b></p><p class="note">Check that you ran supabase.sql and that the URL and anon key in index.html are correct, then try again.</p><div class="mrow" style="margin-top:10px"><button class="btn small" id="retry">try again</button></div>`);
    $('#retry').onclick=createLink;
  }
}
async function showShare(link,note){
  const pretty=link.replace(/^https?:\/\//,'');
  showModal(`<h3>your surprise is ready ♡</h3><canvas id="qr" width="640" height="760"></canvas>
    ${link.length<=90?`<div class="pl">${esc(pretty)}</div>`:''}
    <div class="linkrow"><input type="text" id="lnk" readonly><button class="btn small" id="cpy">copy</button></div>
    <div class="mrow"><button class="btn small" id="shr">share ✧</button><button class="btn small ghost" id="dl">save QR</button><button class="btn small ghost" id="opn">open</button></div>
    ${note?`<p class="note">${esc(note)}</p>`:''}${(()=>{try{return new URL(shareBase()).host!==location.host?`<p class="note">This link opens once this page is live at <b>${esc(new URL(shareBase()).host)}</b>.</p>`:'';}catch(e){return '';}})()}`);
  $('#lnk').value=link;
  try{await document.fonts.load('64px "Great Vibes"');}catch(e){}
  if(!drawQR($('#qr'),link))$('#qr').style.display='none';
  $('#cpy').onclick=async()=>{try{await navigator.clipboard.writeText(link);}catch(e){$('#lnk').select();try{document.execCommand('copy');}catch(e2){}}toast('link copied ♡');};
  $('#shr').onclick=()=>{if(navigator.share)navigator.share({title:'a little surprise for you ♡',text:'I made something for you ♡',url:link}).catch(()=>{});else $('#cpy').click();};
  $('#dl').onclick=()=>{$('#qr').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='petalnote-qr.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);});};
  $('#opn').onclick=()=>window.open(link,'_blank');
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawQR(cv,url){
  let qr=null,lvl='';for(const l of ['H','Q','M','L']){const q=QR.make(url,l);if(q){qr=q;lvl=l;break;}}
  if(!qr)return false;
  const x=cv.getContext('2d'),S=640,HH=760,n=qr.n;
  const bg=x.createLinearGradient(0,0,S,HH);bg.addColorStop(0,'#fff3f8');bg.addColorStop(1,'#ffcfe2');
  x.fillStyle=bg;rr(x,0,0,S,HH,44);x.fill();
  x.strokeStyle='#ff9cc2';x.lineWidth=6;x.setLineDash([2,14]);x.lineCap='round';rr(x,16,16,S-32,HH-32,34);x.stroke();x.setLineDash([]);
  x.fillStyle='#e0568c';x.textAlign='center';x.font='64px "Great Vibes",cursive';x.fillText('scan me ♡',S/2,84);
  const P=500,px0=(S-P)/2,py0=116,pad=24,Q=P-pad*2,m=Q/n,ox=px0+pad,oy=py0+pad;
  x.save();x.shadowColor='rgba(224,86,140,.35)';x.shadowBlur=24;x.shadowOffsetY=8;x.fillStyle='#fff';rr(x,px0,py0,P,P,34);x.fill();x.restore();
  const g=x.createLinearGradient(ox,oy,ox+Q,oy+Q);g.addColorStop(0,'#d03a74');g.addColorStop(1,'#8e1548');x.fillStyle=g;
  const inF=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  const logo=lvl==='H'||lvl==='Q',lr=Math.round(n*(lvl==='H'?.09:.06))+1,mid=(n-1)/2;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(inF(r,c))continue;if(logo&&Math.abs(r-mid)<=lr&&Math.abs(c-mid)<=lr)continue;
    if(qr.isDark(r,c)){x.beginPath();x.arc(ox+c*m+m/2,oy+r*m+m/2,m*.47,0,6.2832);x.fill();}}
  [[0,0],[0,n-7],[n-7,0]].forEach(([r,c])=>{const fx=ox+c*m,fy=oy+r*m;x.fillStyle=g;rr(x,fx,fy,7*m,7*m,2.2*m);x.fill();x.fillStyle='#fff';rr(x,fx+m,fy+m,5*m,5*m,1.5*m);x.fill();x.fillStyle=g;rr(x,fx+2*m,fy+2*m,3*m,3*m,m);x.fill();});
  if(logo){const cs=(lr*2+1)*m,cx=ox+Q/2,cy=oy+Q/2;x.fillStyle='#fff';rr(x,cx-cs/2,cy-cs/2,cs,cs,cs*.3);x.fill();
    const hs=cs*.3;x.fillStyle='#ee5d95';x.beginPath();x.moveTo(cx,cy-hs*.3);x.bezierCurveTo(cx,cy-hs,cx-hs*1.25,cy-hs,cx-hs*1.25,cy-hs*.15);x.bezierCurveTo(cx-hs*1.25,cy+hs*.55,cx,cy+hs*.85,cx,cy+hs*1.25);x.bezierCurveTo(cx,cy+hs*.85,cx+hs*1.25,cy+hs*.55,cx+hs*1.25,cy-hs*.15);x.bezierCurveTo(cx+hs*1.25,cy-hs,cx,cy-hs,cx,cy-hs*.3);x.fill();}
  x.fillStyle='#a25a7c';x.font='600 26px Quicksand,sans-serif';x.fillText('a little surprise made just for you',S/2,py0+P+62);
  x.font='34px serif';x.fillText('✿  ✧  ♡  ✧  ✿',S/2,py0+P+112);
  [[56,150,1.6],[586,170,1.3],[44,640,1.2],[598,620,1.7],[70,380,1],[580,420,1.1]].forEach(([a,b,s])=>{x.save();x.translate(a,b);x.scale(s*2,s*2);x.fillStyle='#ff9cc2';x.beginPath();x.moveTo(0,-9);x.lineTo(2.2,-2.2);x.lineTo(9,0);x.lineTo(2.2,2.2);x.lineTo(0,9);x.lineTo(-2.2,2.2);x.lineTo(-9,0);x.lineTo(-2.2,-2.2);x.closePath();x.fill();x.restore();});
  return true;
}

/* =====================================================================
   BOOT
   ===================================================================== */
function sanitize(d){
  d=d&&typeof d==='object'?d:{};
  const s=(v,max)=>typeof v==='string'?prettify(v).slice(0,max):'';
  const bg=d.bg&&['sky','bows','wash','custom'].includes(d.bg.type)?{type:d.bg.type,url:safeUrl(d.bg.url)}:{type:'sky'};
  if(bg.type==='custom'&&!bg.url)bg.type='sky';
  const wishes=Array.isArray(d.wishes)?d.wishes.slice(0,8).map(w=>s(w,80)).filter(Boolean):[];
  return{to:s(d.to,40),from:s(d.from,40),letter:s(d.letter,1300)||DEFAULT_LETTER,finalMsg:s(d.finalMsg,600)||DEFAULT_FINAL,bg,
    wishes:wishes.length?wishes:DEFAULT_WISHES,
    photos:Array.isArray(d.photos)?d.photos.slice(0,8).map(p=>({url:safeUrl(p&&p.url),cap:s(p&&p.cap,40)})).filter(p=>p.url):[],
    songs:Array.isArray(d.songs)?d.songs.slice(0,3).map(p=>({url:safeUrl(p&&p.url),title:s(p&&p.title,50)})).filter(p=>p.url):[]};
}
function cardIdFromUrl(){
  const q=location.search.replace(/^\?/,'');if(!q)return null;
  const first=q.split('&')[0];if(/^[a-z0-9]{6,16}$/.test(first))return first;
  const c=new URLSearchParams(location.search).get('c');return c&&/^[a-z0-9]{6,16}$/.test(c)?c:null;
}
function failView(msg){
  const l=$('#loading');l.classList.remove('hidden');
  l.innerHTML=`<div class="h">♡</div><div style="font-size:2rem;line-height:1.1;padding:0 20px">this surprise couldn't be opened</div><p style="font-family:var(--sans);font-size:.85rem;font-weight:600;color:var(--soft);max-width:300px;line-height:1.5;padding:0 12px">${esc(msg)}</p><div class="mrow" style="margin-top:6px"><button class="btn small" id="again">try again</button><button class="btn small ghost" id="mkown">make your own ✧</button></div>`;
  $('#again').onclick=()=>location.reload();$('#mkown').onclick=()=>{location.href=location.pathname+'?make';};
}
async function boot(){
  setScene({type:'sky'});
  const id=cardIdFromUrl(),qp=new URLSearchParams(location.search),dp=qp.get('d');
  if(id){
    try{
      if(!SB_ON)throw new Error('This page is not connected to Supabase yet. Open index.html, paste your Supabase URL and anon key into CONFIG at the top, and upload it again.');
      const data=await API.getCard(id);
      if(!data)throw new Error('We could not find this card. The link may be incomplete, or the card was removed.');
      return mountCard(sanitize(data));
    }catch(err){console.warn(err);return failView(err&&err.message||String(err));}
  }
  try{
    if(dp)return mountCard(sanitize(b64d(dp)));
    if(location.hash.startsWith('#d='))return mountCard(sanitize(b64d(location.hash.slice(3))));
  }catch(err){console.warn(err);return failView('This link is incomplete, so the surprise inside could not be read. Ask for the link again.');}
  if(qp.has('make')){$('#loading').classList.add('hidden');return openEditor();}
  mountCard(SAMPLE);
}
boot();
